services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: signalhub
      POSTGRES_PASSWORD: signalhub
      POSTGRES_DB: signalhub
    ports:
      # 5433 on the host: a native Postgres install commonly squats on the
      # default 5432, so we avoid colliding with it. The api service talks
      # to the container over the internal Docker network on db:5432
      # regardless — this only affects host-side tools (psql, alembic,
      # pytest against Postgres).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://signalhub:signalhub@db:5432/signalhub
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
